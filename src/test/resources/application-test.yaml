# Изолированный контекст для @SpringBootTest (без WildFly JNDI)
spring:
  jersey:
    application-path: /engine-rest
    init:
      jersey.config.server.resource.validation.disable: "true"
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.JndiDataSourceAutoConfiguration
  datasource:
    # без MODE=PostgreSQL: Camunda DDL с типом BLOB несовместим с режимом совместимости Postgres в H2
    url: jdbc:h2:mem:blps_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        transaction.jta.platform: org.hibernate.engine.transaction.jta.platform.internal.NoJtaPlatform
  flyway:
    enabled: false

camunda.bpm:
  auto-deployment-enabled: false
  generic-properties:
    properties:
      enforceHistoryTimeToLive: false
  database:
    type: h2
    schema-update: true
