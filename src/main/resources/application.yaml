spring:
  application:
    name: blps
  
  # Профиль по умолчанию для локальной разработки (WildFly: wildfly, тесты: test/verify)
  profiles:
    active: dev
  
  # Jersey (Camunda engine-rest)
  jersey:
    application-path: /engine-rest
    # Camunda engine-rest: на строгой Jersey (WildFly) валидация модели даёт ложные FATAL на history API
    init:
      jersey.config.server.resource.validation.disable: "true"

# Настройки сервера
server:
  servlet:
    # Должен совпадать с jboss-web.xml <context-root> — иначе Tasklist не резолвит embedded-формы
    context-path: /blps
  compression:
    enabled: true
  error:
    include-message: always
    include-binding-errors: always

# Настройки логирования (общие)
logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

camunda.bpm:
  # Spin JSON для переменных форм (tariffOptions, vacancyOptions)
  spin:
    enabled: true
  # admin-user не задаём: CreateAdminUser ломает read-only BlpsIdentityProvider.
  # Вход в Tasklist — email/пароль пользователя из БД (см. blps.bootstrap).
  filter:
    create: All Tasks
  # Полный редеплой BPMN при каждом старте (иначе в БД остаётся v2 без BPMNEdge)
  deploy-changed-only: false
  enable-duplicate-filtering: false
  generic-properties:
    properties:
      historyTimeToLive: P180D
  database:
    schema-update: true
  # BPMN+forms деплоятся в BlpsCamundaDeploymentConfig (один deployment, имена forms/…)
  auto-deployment-enabled: false
  webapp:
    # По умолчанию /camunda → на WildFly: /blps/camunda/app/... (НЕ менять на /blps — сломает webapp)
    index-redirect-enabled: true

blps:
  bootstrap:
    admin-email: admin@ya.ru
    admin-password: admin
    admin-company-name: Admin Company
