# WildFly: JNDI DataSource и JTA (активируйте: spring.profiles.active=wildfly)
spring:
  datasource:
    jndi-name: java:jboss/datasources/BlpsDS
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: UTC
        transaction:
          jta:
            platform: org.hibernate.engine.transaction.jta.platform.internal.JBossAppServerJtaPlatform
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    validate-on-migrate: true

camunda.bpm:
  auto-deployment-enabled: false
